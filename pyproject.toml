[project]
name = "rootline-mcp"
version = "0.1.0"
description = "MCP connector for the Rootline benchmark: start scoring runs, watch the queue, merge and explore results"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Affan Shaik" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "polars>=1.0",
    "httpx>=0.27",
    "huggingface-hub>=0.25",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
rootline-mcp = "rootline_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootline_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
